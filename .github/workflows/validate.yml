name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The domain is not listed in home-assistant/brands; that is only
          # required for inclusion in the HACS default repository list.
          ignore: brands

  checks:
    name: Lint, client test, translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp pyyaml pyflakes
      - run: python -m pyflakes custom_components/myskoda_public_api
      - run: python scripts/check_translations.py
      - run: python tests/test_api_client.py
